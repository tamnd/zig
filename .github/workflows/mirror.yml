name: mirror

# Mirrors codeberg.org/ziglang/zig daily. Upstream branches land under
# refs/heads/upstream/* so they don't clobber this repo's main branch
# (which holds the README and this workflow). Tags mirror 1:1.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_URL: https://codeberg.org/ziglang/zig.git

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone upstream (bare)
        run: git clone --bare "$UPSTREAM_URL" upstream.git

      - name: Push upstream refs to this repo
        working-directory: upstream.git
        env:
          # MIRROR_PAT (PAT with `workflow` scope) lets us push refs that
          # contain workflow files. Without it, those refs are rejected by
          # GitHub's permission check and silently skipped.
          PUSH_TOKEN: ${{ secrets.MIRROR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Branches: refs/heads/* on upstream -> refs/heads/upstream/* here.
          # --prune removes upstream/<branch> mirrors when upstream deletes them.
          git push --force --prune "$url" 'refs/heads/*:refs/heads/upstream/*' || true
          # Tags: mirror 1:1.
          git push --force --prune "$url" 'refs/tags/*:refs/tags/*' || true
